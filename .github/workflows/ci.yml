name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build + Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21]
    steps:
      - uses: actions/checkout@v7

      # The lite-tier modules build protoc-gen-pxf-java-meta with Go (#60):
      # from ../protowire when it is checked out beside this repo, otherwise
      # `go install` at the ref pinned in gradle.properties.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build + test all modules (test tasks finalize with Jacoco)
        run: ./gradlew --no-daemon build

      - name: Upload per-module Jacoco coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.java }}
          path: "**/build/reports/jacoco/"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  # The cross-port gates live in the spec repo and otherwise run against main,
  # so a conformance break shows up only after it merges (protowire#503). This
  # runs them on the PR's own code, against the spec and Go at their main.
  conformance:
    name: Conformance (Go reference)
    runs-on: ubuntu-latest
    env:
      PROTOWIRE_DIR: ${{ github.workspace }}/.conformance/protowire
      GO_DIR: ${{ github.workspace }}/.conformance/protowire-go
      JAVA_DIR: ${{ github.workspace }}
      SKIP_PORTS: cpp,ts,rust,swift,dart,csharp,python
      REQUIRE_PORTS: go,java,java-lite
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire
          path: .conformance/protowire

      - uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          path: .conformance/protowire-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: .conformance/protowire-go/go.mod
          cache-dependency-path: .conformance/protowire-go/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The gates build this repo through ./gradlew. Without this the wrapper
      # downloads Gradle on every run.
      - uses: gradle/actions/setup-gradle@v6

      - name: Text gate
        run: "$PROTOWIRE_DIR/scripts/cross_text_check.sh"

      - name: Security gate
        run: "$PROTOWIRE_DIR/scripts/cross_security_check.sh"

      # PB bytes written from PXF text, against protowire-go's goldens
      # (protowire#511, #163).
      - name: Write gate
        run: "$PROTOWIRE_DIR/scripts/cross_write_check.sh"

      # pb-go-golden.txt is a byte copy of the spec's struct-binding table
      # (protowire#518).
      - name: Struct-binding table matches the spec's
        run: cmp "$PROTOWIRE_DIR/testdata/values/values.tsv" pb/src/test/resources/golden/pb-go-golden.txt

      # testdata/ is the spec corpus both tiers run (#211). A fixture the spec
      # adds or changes fails here until it is copied, and the copy fails a
      # tier's test until that tier meets it or lists it as a known gap.
      - name: Spec corpus copy matches the spec's
        run: scripts/check-spec-corpus.sh "$PROTOWIRE_DIR"

      # scripts/go-verdicts/corpus.tsv is protowire-go's verdict on each
      # corpus document, which GoVerdictsTest and GoVerdictsLiteTest hold the
      # two tiers to. Rerun against protowire-go main, so a change in Go's
      # verdicts or wording fails here until the table, and the tiers, follow.
      - name: Go verdict table matches protowire-go's
        working-directory: ${{ env.GO_DIR }}
        run: >-
          go run "$JAVA_DIR/scripts/go-verdicts/main.go" "$JAVA_DIR/testdata" "$PROTOWIRE_DIR/proto"
          | diff -u "$JAVA_DIR/scripts/go-verdicts/corpus.tsv" -
          && echo "scripts/go-verdicts/corpus.tsv: $(wc -l < "$JAVA_DIR/scripts/go-verdicts/corpus.tsv") documents match protowire-go"

      # pxf/src/test/resources/dataset-write/go.tsv is what protowire-go's
      # @dataset writer does with each of DatasetWriterTest's cases (#204).
      # Rerun against protowire-go main, so a change in Go's writer fails here
      # until the table, and the full tier, follow.
      - name: Dataset writer table matches protowire-go's
        working-directory: ${{ env.GO_DIR }}
        run: >-
          go run "$JAVA_DIR/scripts/go-dataset-write/main.go"
          "$JAVA_DIR/pxf/src/test/resources/dataset-write/cases.tsv"
          "$JAVA_DIR/pxf/src/test/proto" "$JAVA_DIR/proto-annotations/src/main/proto"
          | diff -u "$JAVA_DIR/pxf/src/test/resources/dataset-write/go.tsv" -
          && echo "pxf/src/test/resources/dataset-write/go.tsv: $(wc -l < "$JAVA_DIR/pxf/src/test/resources/dataset-write/go.tsv") cases match protowire-go"

      # pxf-runtime/src/test/resources/tolerant/go.tsv is what protowire-go's
      # ParseTolerant makes of each of TolerantParseTest's documents (#208).
      # Rerun against protowire-go main, so a change in Go's recovery fails
      # here until the table, and the parser, follow.
      - name: Tolerant-parse table matches protowire-go's
        working-directory: ${{ env.GO_DIR }}
        run: >-
          go run "$JAVA_DIR/scripts/go-tolerant/main.go"
          "$JAVA_DIR/pxf-runtime/src/test/resources/tolerant/cases.tsv"
          | diff -u "$JAVA_DIR/pxf-runtime/src/test/resources/tolerant/go.tsv" -
          && echo "pxf-runtime/src/test/resources/tolerant/go.tsv: $(wc -l < "$JAVA_DIR/pxf-runtime/src/test/resources/tolerant/go.tsv") documents match protowire-go"
