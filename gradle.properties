org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# protoc-gen-pxf-java-meta, the Go plugin the *-android modules generate
# their PxfMeta companions with. Built from ../protowire when that checkout
# exists (override the location with -PpxfJavaMeta.repo=<dir>); otherwise
# the spec repo is shallow-fetched at this ref and the plugin built from it.
