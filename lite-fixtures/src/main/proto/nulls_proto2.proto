// The proto2 schema for the null-binding fixtures under testdata/nulls/
// (issue #339): a proto2 singular scalar has explicit presence, and a
// proto2 required field rejects null (#379).

syntax = "proto2";

package nulls.v1;

// Java options for this port's codegen; the rest of the file is protowire's
// testdata/nulls/nulls_proto2.proto verbatim.
option java_package = "nulls.v1";
option java_multiple_files = true;

message Legacy {
  optional int32 p = 1;
}

message Strict {
  required int32 r = 1;
}
