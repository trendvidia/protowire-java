syntax = "proto3";
package wkt.test.v1;

option java_package = "wkt.test.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "pxf/bignum.proto";
import "pxf/secret.proto";

// Smoke fixture for the full lite codegen chain — every recognized
// well-known type appears as a field, so the emitted AllWktPxfMeta exercises
// each WELL_KNOWN_KINDS branch and the AllWktPxfCodec.{marshal,unmarshal}
// pair drives both directions of the round-trip.
message AllWkt {
  google.protobuf.Timestamp ts = 1;
  google.protobuf.Duration dur = 2;
  google.protobuf.StringValue str_w = 3;
  google.protobuf.Int32Value i32_w = 4;
  google.protobuf.BoolValue bool_w = 5;
  google.protobuf.DoubleValue dbl_w = 6;
  pxf.BigInt big_int = 7;
  pxf.Decimal dec = 8;
  pxf.BigFloat big_float = 9;
}

// pxf.Secret in each place the literal may stand. Kept apart from AllWkt, which
// asserts on its whole text.
message Secrets {
  pxf.Secret pw = 1;
  repeated pxf.Secret list = 2;
  map<string, pxf.Secret> by_name = 3;
}

// google.protobuf.Duration in the places a block replaces its literal when the
// value is too long for one.
message Durations {
  repeated google.protobuf.Duration list = 1;
  map<string, google.protobuf.Duration> by_name = 2;
}

// The well-known types with a block form, each as a block. Kept apart from
// AllWkt for the same reason as Secrets.
message Blocks {
  google.protobuf.StringValue str_w = 1;
  google.protobuf.BytesValue bytes_w = 2;
  google.protobuf.BoolValue bool_w = 3;
  google.protobuf.Int32Value i32_w = 4;
  google.protobuf.Int64Value i64_w = 5;
  google.protobuf.UInt32Value u32_w = 6;
  google.protobuf.UInt64Value u64_w = 7;
  google.protobuf.FloatValue flt_w = 8;
  google.protobuf.DoubleValue dbl_w = 9;
  pxf.BigInt big_int = 10;
  pxf.Decimal dec = 11;
  pxf.BigFloat big_float = 12;
  repeated pxf.BigInt ints = 13;
  map<string, pxf.Decimal> decs = 14;
  repeated google.protobuf.Int32Value wrapped = 15;
  map<string, google.protobuf.StringValue> names = 16;
}
