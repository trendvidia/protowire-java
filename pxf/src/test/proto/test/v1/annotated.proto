//
// Conformant schemas carrying (pxf.default) / (pxf.required) / (pxf.key)
// for the post-decode pass (FastDecoder.postDecode, #53) and the keyed
// form (#50). Every placement here binds: the bind-time checks (#54) walk
// the whole file, so a violating message would poison the conformant
// ones — those live in annotated_invalid.proto. Kept apart from
// test.proto so the round-trip fixtures there stay annotation-free.
syntax = "proto3";
package test.v1;

option java_package = "org.protowire.pxf.testproto";
option java_multiple_files = true;

import "google/protobuf/wrappers.proto";
import "pxf/annotations.proto";
import "pxf/bignum.proto";

// The #53 repro: one annotated member is enough.
message OneDefault {
  oneof choice {
    string a = 1;
    string b = 2 [(pxf.default) = "bbb"];
  }
  string outside = 3 [(pxf.default) = "out"];
}

// A member bound to null counts as present.
message NullableSibling {
  oneof choice {
    google.protobuf.StringValue w = 1;
    string b = 2 [(pxf.default) = "bbb"];
  }
}

// proto3 `optional` sits in a synthetic single-member oneof; nothing can
// clear it, so its default keeps applying.
message SyntheticOneof {
  optional string opt = 1 [(pxf.default) = "syn"];
}

// The oneof rule applies at every nesting level, keyed by path.
message NestedOneDefault {
  OneDefault inner = 1;
}

// A bool default has exactly two spellings.
message BoolDefault {
  bool flag = 1 [(pxf.default) = "true"];
  bool off = 2 [(pxf.default) = "false"];
}

message BadBoolDefault {
  bool flag = 1 [(pxf.default) = "yes"];
}

// The literal is checked at decode time, not bind time ("Default
// Placement": the constraint is on placement, not on the literal).
message BadIntDefault {
  int32 n = 1 [(pxf.default) = "abc"];
}

// The three big-number targets, the shape of the corpus's
// adversarial.v1.BigNumHolder (MaxNumericLiteralDigits, #81).
message BigNums {
  pxf.BigInt big_int = 1;
  pxf.Decimal decimal = 2;
  pxf.BigFloat big_float = 3;
}

// A conformant (pxf.key): a repeated message-typed field whose value
// names a singular string field of the element message (#54 §3.13.1).
message KeyedOk {
  repeated Item items = 1 [(pxf.key) = "name"];
}

message Item {
  string name = 1;
  int32 value = 2;
}
