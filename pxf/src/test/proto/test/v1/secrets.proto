// pxf.Secret in each place a value can sit, for the scalar shorthand.
syntax = "proto3";
package test.v1.secrets;

import "pxf/secret.proto";

option java_multiple_files = false;
option java_outer_classname = "Secrets";

message Nested {
  pxf.Secret pw = 1;
}

message Vault {
  pxf.Secret pw = 1;
  repeated pxf.Secret list = 2;
  map<string, pxf.Secret> by_name = 3;
  Nested nested = 4;
}
