// Schema 1's template 7. b.proto's schema 2 has a template 7 too: a template
// id is unique only within a schema (#196, protowire-go#253, #257).
syntax = "proto3";

package header.a.v1;

import "sbe/annotations.proto";

option (sbe.schema_id) = 1;

message A7 {
  option (sbe.template_id) = 7;
  int32 x = 1;
}
