// Two messages sharing one template id in one schema, which draft -01
// § SBE Annotations forbids and Codec.of refuses (#196, protowire-go#253).
syntax = "proto3";

package header.dup.v1;

import "sbe/annotations.proto";

option (sbe.schema_id) = 3;

message X {
  option (sbe.template_id) = 5;
  int32 a = 1;
}

message Y {
  option (sbe.template_id) = 5;
  int32 b = 1;
}
