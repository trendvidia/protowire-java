syntax = "proto3";

package ranges.oneofcomposite.v1;

import "sbe/annotations.proto";

option (sbe.schema_id) = 11;

message C {
  oneof v {
    int32 a = 1;
    int64 b = 2;
  }
}

message S {
  option (sbe.template_id) = 1;
  C c = 1;
}
