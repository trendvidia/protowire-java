// Values an (sbe.encoding) primitive or a field cannot hold (#197,
// protowire-go#252), and a group past numInGroup (#198).
syntax = "proto3";

package ranges.v1;

import "sbe/annotations.proto";

option (sbe.schema_id) = 10;

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
}

message R {
  option (sbe.template_id) = 1;
  int32 i8 = 1 [(sbe.encoding) = "int8"];
  int32 u16 = 2 [(sbe.encoding) = "uint16"];
  Color color = 3;
  double f = 4 [(sbe.encoding) = "float"];
  int32 from_u32 = 5 [(sbe.encoding) = "uint32"];
  float from_d = 6 [(sbe.encoding) = "double"];
  bool b8 = 7 [(sbe.encoding) = "int8"];
  uint32 u_i8 = 8 [(sbe.encoding) = "int8"];
}

message E {
  int32 n = 1;
}

message G {
  option (sbe.template_id) = 2;
  repeated E es = 1;
}
